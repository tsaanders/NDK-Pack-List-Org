<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NDK Pack List Org</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.75rem; color: #1a365d; margin-bottom: 8px; }
    .sub { color: #718096; margin-bottom: 32px; font-size: 1rem; }
    .upload-zone {
      border: 3px dashed #a0aec0;
      border-radius: 12px;
      padding: 48px 24px;
      background: #f7fafc;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: #3182ce;
      background: #ebf8ff;
    }
    .upload-zone p { font-size: 1.1rem; color: #4a5568; margin-top: 12px; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      background: #2b6cb0;
      color: white;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 16px 40px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      min-height: 56px;
    }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn:active { background: #2c5282; }
    input[type=file] { display: none; }
    .flash {
      background: #fff5f5;
      color: #c53030;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #fc8181;
    }
    .hint { margin-top: 20px; font-size: 0.9rem; color: #718096; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NDK Pack List Org</h1>
    <p class="sub">Packing List Organizer</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data" id="uploadForm">
      <label class="upload-zone" id="dropZone" for="fileInput">
        <div style="font-size: 3rem;">📄</div>
        <p>Tap to select packing list PDF</p>
        <p style="font-size: 0.85rem; color: #a0aec0; margin-top: 8px;">or drag &amp; drop here</p>
      </label>
      <input type="file" name="file" id="fileInput" accept=".pdf,application/pdf">
      <div id="fileName" style="margin-top: 12px; font-weight: 600; color: #2b6cb0;"></div>
      <button type="submit" class="btn" id="submitBtn" disabled>Process Packing List</button>
    </form>
    <p class="hint">Upload the packing list PDF from WooCommerce.<br>Orders will be sorted by greenhouse location.</p>
  </div>

  <script>
    const input = document.getElementById('fileInput');
    const zone = document.getElementById('dropZone');
    const nameEl = document.getElementById('fileName');
    const btn = document.getElementById('submitBtn');

    input.addEventListener('change', () => {
      if (input.files.length) {
        nameEl.textContent = input.files[0].name;
        btn.disabled = false;
      }
    });

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        nameEl.textContent = e.dataTransfer.files[0].name;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
